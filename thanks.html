<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Message Sent</title>

  <!-- Immediate Theme Check Script (Prevents FOUC/White Flash) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ================= SYSTEM DESIGN TOKENS ================= */
    :root {
      --bg: #0b0b0b;
      --text: #F9FAFB;
      --text-muted: #c9c9c9;
      --brand-blue: #0053B5;
      --brand-blue-hover: #004394;
      --glassLI: rgba(15, 17, 20, .45);
      --border: rgba(255, 255, 255, .05);
      --card-bg: #111111;
    }

    /* Light Mode Tokens */
    html.light-theme,
    body.light-theme {
      --bg: #F4F5F6;
      --text: #0F1115;
      --text-muted: rgba(15, 17, 21, .9);
      --brand-blue: #0053B5;
      --brand-blue-hover: #004394;
      --glassLI: rgba(255, 255, 255, 1);
      --border: rgba(15, 17, 21, .06);
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comfortaa", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.3s ease, color 0.3s ease;
      position: relative;
    }

    /* ================= CARD CONTAINER ================= */
    .thanks-card {
      width: calc(100% - 32px);
      max-width: 580px;
      margin: 0 auto;
      border-radius: 40px;
      background: var(--glassLI);
      border: 1px solid var(--border);
      padding: 56px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Success Icon Styling */
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      background: rgba(0, 83, 181, 0.08);
      border: 1px solid var(--brand-blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-icon {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: var(--brand-blue);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.8s ease-in-out forwards 0.2s;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Typography */
    .thanks-title {
      font-family: "Comfortaa", sans-serif;
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 16px;
    }

    .thanks-message {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 36px;
      font-weight: 400;
    }

    /* Back Home Button */
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 50px;
      background: var(--brand-blue);
      color: #ffffff;
      font-family: "Outfit", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      box-shadow: none;
      transition: background-color 0.2s ease, transform 0.12s cubic-bezier(0.2, 0, 0, 1), opacity 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn-home:hover {
      background: var(--brand-blue-hover);
      transform: translateY(-2px);
      box-shadow: none;
    }

    .btn-home:active {
      transform: scale(0.92) !important;
      opacity: 0.85;
    }

    .home-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Ripple Animation Element */
    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transform: scale(0);
      animation: ripple-animation 0.4s cubic-bezier(0, 0, 0.2, 1);
      pointer-events: none;
    }

    @keyframes ripple-animation {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* ================= RESPONSIVE RULES ================= */
    @media (max-width: 768px) {
      .thanks-card {
        width: calc(100% - 16px);
        border-radius: 24px;
        padding: 36px 20px;
      }

      .icon-wrapper {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
      }

      .check-icon {
        width: 28px;
        height: 28px;
      }

      .thanks-title {
        font-size: 1.75rem;
      }

      .thanks-message {
        font-size: 0.95rem;
        margin-bottom: 28px;
      }

      .btn-home {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="thanks-card">
    <!-- Animated Checkmark Icon -->
    <div class="icon-wrapper">
      <svg class="check-icon" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <!-- Confirmation Heading -->
    <h1 class="thanks-title">Message Received!</h1>

    <!-- Subtitle Text -->
    <p class="thanks-message">
      Thank you for reaching out. Your message has been sent successfully, and I will get back to you as soon as possible.
    </p>

    <!-- Navigation Action -->
    <a href="/" class="btn-home" id="homeBtn">
      <svg class="home-icon" viewBox="0 0 576 512">
        <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32v160c0 17.7-14.3 32-32 32h-112c-17.7 0-32-14.3-32-32V352h-96v96c0 17.7-14.3 32-32 32H96c-17.7 0-32-14.3-32-32V287.6H32c-17 0-32-14.1-32-32.1c0-9 3-17 10-24L258 15c12-11 31-11 43 0l248 216.5c7 7 10.8 15 10.8 24z"/>
      </svg>
      <span>Back to Home</span>
    </a>
  </main>

  <script>
    (function() {
      // Synchronize DOM elements on load
      const savedTheme = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      const isLight = savedTheme === 'light' || (!savedTheme && prefersLight);

      if (isLight) {
        document.body.classList.add('light-theme');
      }

      // Listen for dynamic OS system theme adjustments if local preference is unset
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
          document.documentElement.classList.toggle('light-theme', e.matches);
          document.body.classList.toggle('light-theme', e.matches);
        }
      });

      // Pointer Ripple Effect
      const homeBtn = document.getElementById('homeBtn');
      if (homeBtn) {
        homeBtn.addEventListener('pointerdown', function(e) {
          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top - size / 2;

          const existingRipple = this.querySelector('.ripple-wave');
          if (existingRipple) existingRipple.remove();

          const ripple = document.createElement('span');
          ripple.className = 'ripple-wave';
          ripple.style.width = ripple.style.height = `${size}px`;
          ripple.style.left = `${x}px`;
          ripple.style.top = `${y}px`;

          this.appendChild(ripple);
          ripple.addEventListener('animationend', () => ripple.remove());
        });
      }
    })();
  </script>

</body>
</html>
